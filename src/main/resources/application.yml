server:
  port: 8080

spring:
  application:
    name: offresq-gateway

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:offresq}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${DB_USER:offresq}
    password: ${DB_PASS:offresq}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    com.offresq: INFO
    org.springframework.web: INFO