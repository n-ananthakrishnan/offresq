<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>OffResQ Gateway</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/app.css"/>
</head>
<body>
<nav class="navbar app-navbar">
  <div class="navbar-content">
    <div class="navbar-brand">
      <div class="brand-icon">◆</div>
      <div class="brand-text">
        <div class="app-title">OffResQ</div>
        <div class="app-subtitle">GATEWAY</div>
      </div>
    </div>

    <div class="navbar-controls">
      <div class="status-indicator">
        <span class="status-dot" id="connStatus-dot"></span>
        <span class="status-text" id="connStatus">Connecting</span>
      </div>
      <button class="btn-icon-ghost" id="btnClearAll" title="Clear Database">
        <span>⌘</span>
      </button>
    </div>
  </div>
</nav>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="search-container">
        <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input class="search-input" id="searchBox" placeholder="Search device…"/>
      </div>
      
      <div class="filter-group">
        <select class="filter-select" id="filterSelect">
          <option value="all">All Devices</option>
          <option value="emergency">🔴 Emergency</option>
          <option value="normal">🟢 Normal</option>
        </select>
      </div>

      <div class="stats-row">
        <div class="stat-item">
          <span class="stat-label">Total</span>
          <span class="stat-value" id="deviceCount">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Selected</span>
          <span class="stat-value selected-text" id="selectedDevice">—</span>
        </div>
      </div>
    </div>

    <!-- Device List Section -->
    <div class="device-list" id="deviceList">
      <div class="empty-state">
        <div class="empty-icon">⟳</div>
        <div class="empty-title">Waiting for Devices</div>
        <div class="empty-hint">Devices will appear when they post location data</div>
      </div>
    </div>

    <div class="sidebar-footer">
      <div class="info-box">
        <span class="info-icon">ℹ</span>
        <span class="info-text">Click map to set rescue point, select device for route</span>
      </div>

      <div class="button-group">
        <button class="btn-secondary" id="btnRefresh">
          <span class="btn-icon">↻</span> Refresh
        </button>
        <button class="btn-secondary" id="btnClearRescue">
          <span class="btn-icon">✕</span> Clear
        </button>
      </div>

      <div class="route-box" id="routeBox">
        <div class="route-header">
          <span class="route-icon">↗</span>
          <span class="route-title">Route Info</span>
        </div>
        <div class="route-item">
          <span class="route-label">Start Point</span>
          <span class="route-value" id="routeStart">—</span>
        </div>
        <div class="route-item">
          <span class="route-label">Destination</span>
          <span class="route-value" id="routeEnd">—</span>
        </div>
        <div class="route-item highlighted">
          <span class="route-label">Distance</span>
          <span class="route-value distance" id="routeDistance">—</span>
        </div>
      </div>
    </div>
  </aside>

  <main class="map-wrap">
    <div id="map"></div>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
